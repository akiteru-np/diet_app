<div class="card">
      <div class="card-title">🍽️ 食事を記録する</div>
      <div class="form-row">
        <div>
          <label class="field-label">日付</label>
          <input type="date" id="m-date" onchange="loadMealPage()">
        </div>
        <div style="position: relative; flex: 2;">
          <label class="field-label">食べたもの（食材・レシピを検索）</label>
          <input type="text" id="m-name" placeholder="鶏むね肉、沼親子丼..." oninput="handleSearchInput()" autocomplete="off">
          <ul id="search-suggestions" class="data-list" style="display: none; position: absolute; width: 100%; background: white; z-index: 10; margin-top: 4px; box-shadow: var(--shadow); max-height: 200px; overflow-y: auto;"></ul>
        </div>
      </div>

      <div id="recipe-adjust-area" style="display: none; background: var(--purple-lt); padding: 12px; border-radius: 8px; margin-bottom: 12px;">
        <label class="field-label" style="color: var(--purple);">🥗 レシピの分量調整（今回のみ）</label>
        <div id="recipe-adjust-list"></div>
      </div>

      <div class="form-row">
        <div style="display: flex; gap: 8px; align-items: flex-end;">
          <div style="flex: 1;">
            <label class="field-label">量</label>
            <input type="number" id="m-amount" value="100" min="1" placeholder="100" oninput="recalcMealPFC()">
          </div>
          <div style="padding-bottom: 10px; width: 25px; font-size: 14px; color: var(--muted); font-weight: bold;" id="mealUnitLabel">g</div>
        </div>
        <div>
          <label class="field-label">kcal</label>
          <input type="number" id="m-cal" placeholder="0" step="0.1">
        </div>
      </div>
      <div class="form-row">
        <div>
          <label class="field-label">P タンパク質 (g)</label>
          <input type="number" id="m-p" placeholder="0" step="0.1">
        </div>
        <div>
          <label class="field-label">F 脂質 (g)</label>
          <input type="number" id="m-f" placeholder="0" step="0.1">
        </div>
        <div>
          <label class="field-label">C 炭水化物 (g)</label>
          <input type="number" id="m-c" placeholder="0" step="0.1">
        </div>
      </div>
      <button class="btn btn-orange btn-full" onclick="saveMeal()">📥 記録する</button>
    </div>
